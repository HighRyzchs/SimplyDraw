name: Bug
description: Something in SimplyDraw does not behave the way you expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, and what did the app do instead?
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and Windows build
      placeholder: SimplyDraw 0.1.0 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: Input you were using
      options:
        - Pen
        - Touch
        - Mouse
        - More than one
    validations:
      required: true
